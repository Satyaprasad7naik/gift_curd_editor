function getInitials(name) {
  return name.replace(/[^a-zA-Z]/g, '').substring(0, 2).toUpperCase() || '??';
}

function renderComments(list) {
  const container = document.getElementById('commentList');
  const noResults = document.getElementById('noResults');
  container.innerHTML = '';
  if (list.length === 0) {
    noResults.style.display = 'block';
    return;
  }
  noResults.style.display = 'none';
  list.forEach(c => {
    const div = document.createElement('div');
    div.className = 'comment';
    div.innerHTML = `
      <div class="comment-num">${c.id}</div>
      <div class="comment-avatar">${getInitials(c.user)}</div>
      <div class="comment-body">
        <span class="comment-username">@${c.user}</span>
        <span class="comment-time">4w</span>
        <div class="comment-text">${c.text}</div>
      </div>
    `;
    container.appendChild(div);
  });
}

function filterComments() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const filtered = comments.filter(c =>
    c.user.toLowerCase().includes(q) || c.text.toLowerCase().includes(q)
  );
  renderComments(filtered);
}
